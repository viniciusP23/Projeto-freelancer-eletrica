<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="estiloForm.css">
    <title>Formulário</title>
</head>

<body>

    <section class="contatos" id="contatos">
        <h2 class="contatos-titulo">Entre em contato</h2>
        <form class="formulario-contato" id="formulario" onsubmit="enviarWhats(event)">

            <div class="grupo-form">
                <input placeholder="Nome" class="campo-form" id="nome">
            </div>
            <div class="grupo-form">
                <textarea class="campo-form" placeholder="Digite aqui sua mensagem" id="mensagem"></textarea>
            </div>

            <button type="submit" class="btn-form">Enviar WhatsApp</button>

        </form>
    </section>

</body>

<script>
    function enviarWhats(event) {

        event.preventDefault()

        const nome = document.getElementById("nome").value
        const mensagem = document.getElementById("mensagem").value
        const telefone = "5514998169600"

        const texto = `Olá! me chamo ${nome}, ${mensagem}`
        const msgFormatada = encodeURIComponent(texto)

        const url = `https://whatsa.me/${telefone}/?t=${msgFormatada}`

        window.open(url, "_blank")
    }

</script>

</html>
